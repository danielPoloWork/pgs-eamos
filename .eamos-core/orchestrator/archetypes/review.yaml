# Archetype profile: review/status (RFC-0001 §3, axis 1).
# The deep structure of a review meeting, as data — independent of audience, function, language.
# Mirror this file's shape and rigor when authoring a new archetype (RFC-0001 §3).
archetype: review
display_name: Review / Status

# The deep structure: an ordered list of sections. `kind` selects how render.py builds the
# section's blocks; `required` sections cannot be dropped by altitude shaping (completeness gate).
structure:
  - { id: exec_summary,        kind: summary,        required: true }
  - { id: kpi_vs_target,       kind: kpi_table,      required: true }
  - { id: variance_commentary, kind: prose,          required: true }
  - { id: risks_and_asks,      kind: risk_list,      required: true }
  - { id: decisions_required,  kind: decision_list,  required: true }

# Altitude shaping = the per-altitude overlay (RFC-0001 §3, axis 2): same base structure, composed
# differently. Keys: max_slides (caps the deck, audience-fit gate), lead_with/jargon (advisory),
# `drop` (remove sections — never a required one), `order` (stable reorder; listed ids lead).
# c-level leads with the decision/ask; manager keeps the base, detail-first order.
altitude_shaping:
  c-level:
    max_slides: 12
    jargon: none
    lead_with: recommendation
    order: [exec_summary, decisions_required, kpi_vs_target, variance_commentary, risks_and_asks]
  vp:      { max_slides: 18, jargon: some, lead_with: recommendation }
  manager: { max_slides: 25, jargon: full, lead_with: detail }
  ic:      { max_slides: 30, jargon: full, lead_with: detail }

# Deliverable-parameter bounds by altitude (RFC-0002 §5): the enterprise guardrail.
deliverable_bounds:
  c-level:
    presentation: { length: { allow: [short, medium] } }

gates: [completeness, grounding-labeled, audience-fit]
