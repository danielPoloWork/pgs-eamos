# Archetype profile: decision/steering (RFC-0001 §3, axis 1).
# A meeting that asks for an approval: options + trade-offs + a recommendation + the decision ask.
# Steering committees, ESC, architecture review boards, risk boards. Mirror review.yaml's rigor.
archetype: decision
display_name: Decision / Steering

structure:
  - { id: context_framing,        kind: prose,         required: false }  # board drops it (overlay)
  - { id: options,                kind: option_list,   required: true }
  - { id: recommendation,         kind: prose,         required: true }
  - { id: risks_and_mitigations,  kind: risk_list,         required: true }
  - { id: decision_ask,           kind: decision_list,     required: true }
  - { id: decision_contract,      kind: decision_contract, required: true }  # Phase G (#31): residual_risks + next_step

# c-level: lead with the recommendation, drop the context framing (the board already has it).
# vp: keep the context, recommendation still leads. The decision contract (Phase G) closes the deck.
altitude_shaping:
  c-level:
    max_slides: 10
    jargon: none
    lead_with: recommendation
    drop: [context_framing]
    order: [recommendation, options, risks_and_mitigations, decision_ask, decision_contract]
  vp:
    max_slides: 16
    jargon: some
    lead_with: recommendation
    order: [recommendation, context_framing, options, risks_and_mitigations, decision_ask, decision_contract]

deliverable_bounds:
  c-level:
    presentation: { length: { allow: [short, medium] } }

# Phase E (#30): the prescribed canonical menu for a solution space. Advisory — only `no-action` is
# gate-enforced (the no-action-considered gate); the rest are a recommended menu, not a requirement.
# Mark the no-action option in the manifest with `no_action: true` on the option.
canonical_options: [buy-standard, custom-build, hybrid, extend-existing, no-action]

gates: [completeness, grounding-labeled, audience-fit, no-action-considered]
