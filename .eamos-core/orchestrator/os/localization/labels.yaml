# Chrome labels (RFC-0001 §7, #61) — every rendered chrome string, per language, as DATA.
# The single source of truth replacing eight duplicated in-code tables: adding a language is a
# one-file edit here, never a code change. `en` is the declared fallback. A language is supported
# only when it defines EVERY key (half-localized is worse than honestly unsupported) — enforced by
# the labels-valid gate. Namespaces preserve intentional per-deliverable differences (the .docx
# uses title-case, the sheet says "Source / note"), so values must not be merged across them.
#
# core.verify   — the suffix inside the ⟨value — …⟩ grounding marker (RFC-0001 §6)
# core.redacted — the word inside the ⟦…⟧ egress-redaction mask (RFC-0001 §11)
