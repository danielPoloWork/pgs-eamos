# qbr-finance.yaml — review @ c-level × FINANCE. Same `review` archetype as qbr-c-level; the finance
# function pack adds the variance_attestation (SOX-adjacent) section. M3 exit gate.
schema_version: 1

identity:
  series_id: group-finance-review
  instance: "Q3-2026"
  series_name: "Q3-2026 Finance Review — Group"
  archetype: review
  audience_altitude: c-level
  function: finance

context:
  company_size: enterprise
  industry: fintech
  regulatory: [SOX, GDPR]
  framework: SAFe
  formality: high
  output_lang: it

objective: "Approvare il forecast di spesa H2 e attestare gli scostamenti."

deliverables:
  - { type: presentation, format: speaker, length: medium }

inputs:
  kpi.opex:
    label: "OpEx YTD"
    value: "8.9M€"
    provided: true
    source: "ERP / chiusura Q3"
    provenance: sourced
  kpi.opex_budget:
    label: "OpEx budget"
    value: "8.5M€"
    provided: true
    source: "Budget H1 approvato"
    provenance: sourced
  kpi.forecast_h2:
    label: "Forecast spesa H2"
    value: "9.4M€"
    provided: true
    source: "Pianificazione finance H2"
    provenance: sourced

content:
  exec_summary:
    title: "Sintesi esecutiva"
    lead: "OpEx YTD {{kpi.opex}} contro budget {{kpi.opex_budget}}; forecast H2 a {{kpi.forecast_h2}}."
    points:
      - "Scostamento OpEx da attestare (sezione attestazione)."
  kpi_vs_target:
    title: "Spesa vs budget"
    rows:
      - { metric_binding: kpi.opex, target_binding: kpi.opex_budget }
  variance_attestation:
    title: "Attestazione scostamenti (SOX)"
    body: "Lo scostamento OpEx ({{kpi.opex}} vs {{kpi.opex_budget}}) è attestato e tracciato a fonte ERP; nessuna rettifica non documentata."
  variance_commentary:
    title: "Commento agli scostamenti"
    body: "Lo scostamento è guidato da costi cloud non pianificati; rientro previsto in H2."
  risks_and_asks:
    title: "Rischi e richieste"
    risks:
      - { risk: "Forecast H2 sopra budget", ask: "Approvare il re-budget o un piano di rientro" }
  decisions_required:
    title: "Decisioni richieste"
    decisions:
      - "Approvare il forecast spesa H2 a {{kpi.forecast_h2}}."
